<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="../template-styles/warehouse.productlist.css"
    />

    <style>
      html {
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        padding: 1.5rem;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: start;

        img {
          width: 5rem;
          height: 5rem;
        }
        .header__info {
          text-align: end;
        }
      }

      .table__body {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1rem;

        .table__body--title {
          font-size: 1.2rem;
          text-align: center;
          font-weight: 600;
        }

        table {
          width: 100%;
          border-collapse: collapse;

          th,
          td {
            border: 1px solid black;
            padding: 0.4rem 0;
            text-align: center;
          }
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <img
          src="https://res.cloudinary.com/dba8uhq5h/image/upload/v1772536664/logo/dtygqgpxp9dmecxcbug6.png"
          alt="company logo"
        />
      </div>
      <div class="header__info">
        <div>Prototye Limited, Abu Dabi, UAE</div>
        <div>Contact : 9786378390</div>
      </div>
    </header>
    <div class="table__body">
      <div class="table__body--title">Warehouse Order Product List</div>
      <table>
        <thead>
          <tr>
            <th>Sl No</th>
            <th>Product Title</th>
            <th>Part Number</th>
            <th>Quantity</th>
          </tr>
        </thead>
        <tbody>
          {{rows}}
        </tbody>
      </table>
    </div>
  </body>
</html>
